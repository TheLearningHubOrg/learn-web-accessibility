<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Validation Errors Example</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main">
    <p><a href="index.html">Back to all examples</a></p>
    <h1>Create your account</h1>
    <p>All fields are required.</p>

    <div id="error-summary" class="error-summary" tabindex="-1" hidden>
      <h2 id="error-summary-title">There is a problem</h2>
      <ul id="error-list"></ul>
    </div>

    <form id="signup" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" type="text" autocomplete="name" required
               aria-describedby="full-name-error">
        <p id="full-name-error" class="error-message"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <p id="email-hint" class="hint">We only use this to send your receipt.</p>
        <input id="email" name="email" type="email" autocomplete="email" required
               aria-describedby="email-hint email-error">
        <p id="email-error" class="error-message"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <p id="password-hint" class="hint">At least 12 characters.</p>
        <input id="password" name="password" type="password" autocomplete="new-password" required
               minlength="12" aria-describedby="password-hint password-error">
        <p id="password-error" class="error-message"></p>
      </div>

      <button type="submit">Create account</button>
    </form>

    <div id="form-status" role="status"></div>
  </main>
  <script type="module" src="js/form-errors.js"></script>
</body>
</html>
